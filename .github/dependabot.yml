# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet reached 1,461 open pull requests
# across 176 repos, none of them with any CI signal.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18
# backlog was landed by hand, 109 bumps had to be held back and they were
# overwhelmingly majors; grouping a breaking major together with the safe bumps
# makes the whole pull request unmergeable, which is the hand-unpicking this
# exists to prevent.
#
# github-actions majors ARE grouped: the checkout / setup-node / Pages jumps
# were verified green across the fleet on 2026-08-18.
#
# Both groups auto-merge once this lab's own gate passes on the pull request --
# the same build and browser-gate jobs the deploy needs, never a lighter one.
# See the dependabot-auto-merge job in .github/workflows/deploy.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
